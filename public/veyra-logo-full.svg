<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none" width="100%" height="100%">
  <defs>
    <!-- Preserved Blue Gradient for the V Logo Mark -->
    <linearGradient id="veyraBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="veyraAccentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- 1. Blue Gradient V Icon (48px height) -->
  <g transform="translate(4, 6)">
    <rect x="0" y="0" width="48" height="48" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <path d="M14 16L24 34L34 16" stroke="url(#veyraBlueGradient)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24 34L34 16" stroke="url(#veyraAccentGradient)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- 2. Wordmark ONLY: Veyra in #172033, HR in #2563EB (34px font, 800 weight) -->
  <g transform="translate(70, 41)">
    <text font-family="'Plus Jakarta Sans', 'Manrope', 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.015em">
      <tspan fill="#172033">Veyra</tspan><tspan fill="#2563EB">HR</tspan>
    </text>
  </g>
</svg>
